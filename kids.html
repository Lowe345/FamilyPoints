<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⭐ Our Points Board!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  :root {
    --c0: #ff5722; --c1: #1976d2; --c2: #388e3c; --c3: #7b1fa2; --c4: #00838f;
    --radius: 20px;
    --gold: #ffd54f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Nunito’, sans-serif;
min-height: 100vh;
background: #0f0f23;
overflow-x: hidden;
padding-bottom: 32px;
}

/* ── Background ── */
.bg {
position: fixed; inset: 0; z-index: 0; pointer-events: none;
background:
radial-gradient(ellipse at 15% 40%, rgba(120,40,200,0.35) 0%, transparent 55%),
radial-gradient(ellipse at 85% 15%, rgba(255,90,40,0.2) 0%, transparent 50%),
radial-gradient(ellipse at 55% 85%, rgba(30,140,255,0.2) 0%, transparent 50%),
#0f0f23;
}
.star { position: fixed; border-radius: 50%; background: #fff; opacity: 0; animation: twinkle var(–d,3s) var(–delay,0s) infinite; }
@keyframes twinkle { 0%,100%{opacity:0;transform:scale(.5);} 50%{opacity:var(–op,.7);transform:scale(1);} }

/* ── Header ── */
header {
position: relative; z-index: 10;
text-align: center;
padding: 28px 16px 16px;
}
.header-star { font-size: 2.8rem; display: block; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 3px 10px rgba(255,200,0,.7)); }
@keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
header h1 {
font-family: ‘Baloo 2’, cursive; font-weight: 800;
font-size: clamp(1.5rem, 5vw, 2rem);
color: #fff;
text-shadow: 0 0 24px rgba(255,200,50,.8), 0 2px 8px rgba(0,0,0,.5);
margin-top: 4px;
}
.week-label {
color: rgba(255,255,255,.55); font-size: 0.78rem; font-weight: 700;
letter-spacing: .05em; margin-top: 4px;
}

/* ── Jackpot Banner ── */
.jackpot-banner {
position: relative; z-index: 10;
margin: 0 12px 14px;
border-radius: var(–radius);
padding: 14px 16px;
text-align: center;
}
.jackpot-banner.jackpot {
background: linear-gradient(135deg, #f9a825, #ff6f00, #f9a825);
background-size: 200% 200%;
animation: shimmer 2s infinite, glow-gold 2s infinite;
border: 2px solid #ffe082;
color: #fff;
}
.jackpot-banner.partial {
background: linear-gradient(135deg, rgba(30,80,30,.8), rgba(50,120,50,.8));
border: 2px solid rgba(100,200,100,.4);
color: #b9f6ca;
}
.jackpot-banner.none {
background: linear-gradient(135deg, rgba(80,0,30,.8), rgba(140,20,80,.8));
border: 2px solid rgba(200,100,140,.3);
color: #f8bbd0;
}
@keyframes shimmer { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
@keyframes glow-gold { 0%,100%{box-shadow:0 0 16px rgba(255,160,0,.6);} 50%{box-shadow:0 0 36px rgba(255,200,0,.9);} }
.banner-inner { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.banner-emoji { font-size: 1.6rem; }
.banner-text strong { font-family: ‘Baloo 2’, cursive; font-weight: 800; font-size: 1rem; display: block; }
.banner-text span { font-size: 0.75rem; font-weight: 700; opacity: .85; }

/* ── Main Table Card ── */
.table-card {
position: relative; z-index: 10;
margin: 0 12px;
border-radius: var(–radius);
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
backdrop-filter: blur(12px);
overflow: hidden;
}

/* ── Kid Header Row ── */
.kid-headers {
display: flex;
border-bottom: 1px solid rgba(255,255,255,0.1);
}
.row-label-head {
flex: 0 0 72px;
min-width: 72px;
/* spacer for the row labels column */
}
.kid-col {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
padding: 16px 6px 12px;
border-left: 1px solid rgba(255,255,255,0.07);
animation: fadeUp .5s var(–delay, 0s) both;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
.kid-avatar {
width: 52px; height: 52px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 1.8rem;
border: 3px solid;
box-shadow: 0 4px 14px rgba(0,0,0,.4);
margin-bottom: 6px;
animation: pop .4s var(–delay, 0s) both;
}
@keyframes pop { from{transform:scale(0) rotate(-15deg);} to{transform:scale(1) rotate(0);} }
.kid-col:nth-child(2) .kid-avatar { background: rgba(255,87,34,.25); border-color: #ff5722; }
.kid-col:nth-child(3) .kid-avatar { background: rgba(25,118,210,.25); border-color: #1976d2; }
.kid-col:nth-child(4) .kid-avatar { background: rgba(56,142,60,.25); border-color: #388e3c; }
.kid-col:nth-child(5) .kid-avatar { background: rgba(123,31,162,.25); border-color: #7b1fa2; }
.kid-col:nth-child(6) .kid-avatar { background: rgba(0,131,143,.25); border-color: #00838f; }
.kid-name {
font-family: ‘Baloo 2’, cursive; font-weight: 800;
font-size: clamp(0.7rem, 3vw, 0.95rem);
color: #fff;
text-align: center;
line-height: 1.1;
}

/* ── Data Rows ── */
.data-row {
display: flex;
border-bottom: 1px solid rgba(255,255,255,0.07);
}
.data-row:last-child { border-bottom: none; }
.row-label {
flex: 0 0 72px; min-width: 72px;
display: flex; align-items: center; justify-content: center;
flex-direction: column;
padding: 12px 4px;
border-right: 1px solid rgba(255,255,255,0.07);
gap: 3px;
}
.row-label .rl-icon { font-size: 1.1rem; }
.row-label .rl-text {
font-size: 0.58rem; font-weight: 800; letter-spacing: .05em;
text-transform: uppercase; color: rgba(255,255,255,.45);
text-align: center; line-height: 1.2;
}

.data-cell {
flex: 1;
display: flex; align-items: center; justify-content: center;
flex-direction: column;
padding: 12px 4px;
border-left: 1px solid rgba(255,255,255,0.07);
gap: 4px;
animation: fadeUp .5s var(–delay, 0s) both;
}

/* Points row */
.points-row .data-cell { padding: 14px 4px; }
.pts-num {
font-family: ‘Baloo 2’, cursive; font-weight: 800;
font-size: clamp(1.6rem, 5vw, 2rem);
color: #fff;
line-height: 1;
text-shadow: 0 2px 10px rgba(0,0,0,.4);
}
.pts-bar-wrap { width: 100%; padding: 0 4px; }
.pts-bar-track {
height: 6px; background: rgba(0,0,0,.3); border-radius: 10px;
overflow: hidden; border: 1px solid rgba(255,255,255,.12);
}
.pts-bar-fill {
height: 100%; border-radius: 10px;
background: linear-gradient(90deg, rgba(255,255,255,.4), rgba(255,255,255,.9));
transition: width 1.2s cubic-bezier(.4,0,.2,1);
box-shadow: 0 0 8px rgba(255,255,255,.5);
}
/* Coloured fills */
.kid-col:nth-child(2) ~ .data-row .data-cell:nth-child(2) .pts-bar-fill,
.data-row .data-cell:nth-child(2) .pts-bar-fill { background: linear-gradient(90deg, #ff5722, #ff8a65); box-shadow: 0 0 8px rgba(255,87,34,.6); }
.data-row .data-cell:nth-child(3) .pts-bar-fill { background: linear-gradient(90deg, #1976d2, #64b5f6); box-shadow: 0 0 8px rgba(25,118,210,.6); }
.data-row .data-cell:nth-child(4) .pts-bar-fill { background: linear-gradient(90deg, #388e3c, #81c784); box-shadow: 0 0 8px rgba(56,142,60,.6); }
.data-row .data-cell:nth-child(5) .pts-bar-fill { background: linear-gradient(90deg, #7b1fa2, #ce93d8); box-shadow: 0 0 8px rgba(123,31,162,.6); }
.data-row .data-cell:nth-child(6) .pts-bar-fill { background: linear-gradient(90deg, #00838f, #80deea); box-shadow: 0 0 8px rgba(0,131,143,.6); }

/* Payout row */
.payout-badge {
font-family: ‘Baloo 2’, cursive; font-weight: 800;
font-size: clamp(1rem, 4vw, 1.25rem);
border-radius: 50px;
padding: 5px 10px;
text-align: center;
line-height: 1.2;
}
.payout-badge.jackpot {
background: linear-gradient(135deg, rgba(255,213,0,.3), rgba(255,160,0,.3));
border: 2px solid var(–gold);
color: var(–gold);
animation: pulse-gold 1.5s infinite;
}
@keyframes pulse-gold { 0%,100%{box-shadow:0 0 8px rgba(255,215,0,.3);} 50%{box-shadow:0 0 20px rgba(255,215,0,.7);} }
.payout-badge.partial {
background: rgba(255,255,255,.1);
border: 2px solid rgba(255,255,255,.25);
color: rgba(255,255,255,.8);
}
.payout-badge.none {
background: rgba(0,0,0,.2);
border: 2px solid rgba(255,255,255,.1);
color: rgba(255,255,255,.4);
font-size: 0.85rem;
}

/* Encouragement row */
.encourage-row .data-cell {
padding: 10px 6px;
align-items: flex-start;
}
.encourage-text {
font-size: clamp(0.62rem, 2.2vw, 0.75rem);
font-weight: 700;
color: rgba(255,255,255,.75);
line-height: 1.4;
text-align: center;
}
.encourage-icon { font-size: 1rem; }

/* ── Loading ── */
.loading { position: relative; z-index: 10; text-align: center; padding: 60px 20px; color: rgba(255,255,255,.6); }
.loading-spinner { font-size: 2.5rem; display: block; animation: spin 1s linear infinite; margin-bottom: 12px; }
@keyframes spin { to{transform:rotate(360deg);} }

/* ── Confetti ── */
.confetti-wrap { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.confetti-piece { position: absolute; border-radius: 2px; animation: confettiFall var(–d,4s) var(–delay,0s) infinite linear; opacity: 0; }
@keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1;} 100%{transform:translateY(110vh) rotate(720deg);opacity:0;} }

footer { position: relative; z-index: 10; text-align: center; color: rgba(255,255,255,.25); font-size: 0.7rem; font-weight: 700; padding: 20px 20px 0; }

/* ── Nanna's Cup link ── */
.nannacup-link {
  position: relative; z-index: 10;
  margin: 14px 12px 0;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(255,180,0,.15), rgba(255,100,0,.08));
  border: 1.5px solid rgba(255,180,0,.35);
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  text-decoration: none;
  transition: background 0.2s, border-color 0.2s;
  animation: glow-cup 2.5s ease-in-out infinite;
}
.nannacup-link:hover { background: linear-gradient(135deg, rgba(255,180,0,.25), rgba(255,100,0,.15)); border-color: rgba(255,200,0,.6); }
@keyframes glow-cup { 0%,100%{box-shadow:0 0 12px rgba(255,160,0,.2);} 50%{box-shadow:0 0 28px rgba(255,160,0,.45);} }
.nc-left { display: flex; align-items: center; gap: 12px; }
.nc-trophy { font-size: 1.8rem; animation: bob-cup 2.4s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255,200,0,.7)); }
@keyframes bob-cup { 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-5px) rotate(4deg);} }
.nc-text strong { font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 800; color: #ffd54f; display: block; line-height: 1.1; }
.nc-text span { font-size: 0.7rem; font-weight: 700; color: rgba(255,200,80,.6); }
.nc-arrow { font-size: 1.1rem; color: rgba(255,200,80,.6); }
</style>

</head>
<body>

<div class="bg" id="bg"></div>
<div class="confetti-wrap" id="confettiWrap"></div>

<header>
  <span class="header-star">⭐</span>
  <h1>Our Points Board!</h1>
  <div class="week-label" id="weekLabel">Connecting…</div>
</header>

<div class="jackpot-banner none" id="jackpotBanner">
  <div class="banner-inner">
    <span class="banner-emoji" id="bannerEmoji">⏳</span>
    <div class="banner-text">
      <strong id="bannerMain">Loading…</strong>
      <span id="bannerSub"></span>
    </div>
  </div>
</div>

<div id="mainContent">
  <div class="loading">
    <span class="loading-spinner">⭐</span>
    <p>Loading your points…</p>
  </div>
</div>

<a class="nannacup-link" href="NannaCup.html">
  <div class="nc-left">
    <span class="nc-trophy">🏆</span>
    <div class="nc-text">
      <strong>Nanna's Cup</strong>
      <span>Tap to see the competition leaderboard →</span>
    </div>
  </div>
  <span class="nc-arrow">▶</span>
</a>

<footer>Updates automatically • Read only 👀</footer>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCLMsal6EP0T8m6a9qaS79vaSiQAyzV4ag",
  authDomain: "kids-points-afabf.firebaseapp.com",
  databaseURL: "https://kids-points-afabf-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kids-points-afabf",
  storageBucket: "kids-points-afabf.firebasestorage.app",
  messagingSenderId: "746330750970",
  appId: "1:746330750970:web:a8dc2dcbc9c9460f81ee43"
};

const DEFAULT_CONFIG = {
  jackpotReward: 10,
  partialReward: 5,
  jackpotThreshold: 5,
  partialThreshold: 1,
  startPoints: 5
};

// ── Stars ───────────────────────────────────────────
function buildStars() {
  const bg = document.getElementById('bg');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.8;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;position:fixed;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;--op:${0.3+Math.random()*0.6}`;
    bg.appendChild(s);
  }
}

// ── Confetti ─────────────────────────────────────────
function buildConfetti(active) {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  if (!active) return;
  const colours = ['#ffd54f','#ff7043','#42a5f5','#66bb6a','#ab47bc','#26c6da','#fff'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `left:${Math.random()*100}%;background:${colours[Math.floor(Math.random()*colours.length)]};--d:${3+Math.random()*4}s;--delay:${Math.random()*4}s;width:${6+Math.random()*7}px;height:${5+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    wrap.appendChild(c);
  }
}

// ── Encouragement generator ───────────────────────────
function getEncouragement(kid, config, allJackpot, allKids) {
  const pts = kid.currentPoints != null ? kid.currentPoints : config.startPoints;
  const goal = config.jackpotThreshold;
  const needed = goal - pts;
  const pct = pts / goal;

  // Try to reference recent chores from kid data
  const recentChores = kid.chores
    ? (Array.isArray(kid.chores) ? kid.chores : Object.values(kid.chores))
        .filter(c => c && c.completed)
        .map(c => c.name || c.title || '').filter(Boolean).slice(-2)
    : [];

  if (allJackpot) {
    return { icon: '🏆', text: 'Amazing — everyone hit the goal! Enjoy that $' + config.jackpotReward + '!' };
  }

  if (pts >= goal) {
    // Kid is done — nudge them to help siblings still working toward goal
    const siblingsNeeded = allKids
      ? allKids.filter(k => k !== kid && (k.currentPoints != null ? k.currentPoints : config.startPoints) < goal).map(k => k.name)
      : [];
    if (siblingsNeeded.length > 0) {
      const names = siblingsNeeded.join(' & ');
      return { icon: '🤝', text: 'Goal reached! Help ' + names + ' get to ' + goal + ' pts so everyone gets $' + config.jackpotReward + '!' };
    }
    return { icon: '🤝', text: 'Goal reached! Help your siblings hit ' + goal + ' pts so everyone gets $' + config.jackpotReward + '!' };
  }

  if (pct >= 0.8) {
    const chore = recentChores[0];
    return { icon: '🔥', text: chore ? `So close! Keep up the ${chore} work — just ${needed} more pt${needed!==1?'s':''}!` : `Almost there! Just ${needed} more pt${needed!==1?'s':''}!` };
  }

  if (pct >= 0.5) {
    const chore = recentChores[0];
    return { icon: '💪', text: chore ? `Great ${chore}! Halfway there — ${needed} pts to go for $${config.jackpotReward}!` : `Over halfway! ${needed} pts left for $${config.jackpotReward}!` };
  }

  if (pts > 0) {
    return { icon: '⭐', text: `Good start! Earn ${needed} more pt${needed!==1?'s':''} for $${config.jackpotReward} — chores help!` };
  }

  return { icon: '🌟', text: `Do some chores to start earning toward $${config.jackpotReward}!` };
}

// ── Format date ───────────────────────────────────────
function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Render ────────────────────────────────────────────
function render(data) {
  const config = { ...DEFAULT_CONFIG };
  let kids = [];
  let currentWeek = null;

  if (data) {
    if (data.config) {
      const { kids: kidsObj, chores, ...cfg } = data.config;
      Object.assign(config, cfg);
      if (kidsObj) {
        kids = Object.entries(kidsObj)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([, v]) => v);
      }
    }
    if (data.currentWeek) currentWeek = data.currentWeek;
  }

  let weekKids = [];
  if (currentWeek && currentWeek.kids) {
    weekKids = Array.isArray(currentWeek.kids)
      ? currentWeek.kids
      : Object.entries(currentWeek.kids)
          .sort((a, b) => Number(a[0]) - Number(b[0]))
          .map(([, v]) => v);
  }

  const mergedKids = weekKids.map((wk, i) => ({
    ...wk,
    emoji: wk.emoji || (kids[i] && kids[i].emoji) || '⭐',
    name: wk.name || (kids[i] && kids[i].name) || ('Child ' + (i + 1))
  }));

  if (currentWeek && currentWeek.startDate) {
    document.getElementById('weekLabel').textContent = 'Week of ' + formatDate(currentWeek.startDate);
  }

  const allJackpot = mergedKids.length > 0 && mergedKids.every(k => (k.currentPoints != null ? k.currentPoints : config.startPoints) >= config.jackpotThreshold);

  // Banner
  const banner = document.getElementById('jackpotBanner');
  if (allJackpot) {
    banner.className = 'jackpot-banner jackpot';
    document.getElementById('bannerEmoji').textContent = '🏆';
    document.getElementById('bannerMain').textContent = 'JACKPOT! Everyone gets $' + config.jackpotReward + '!';
    document.getElementById('bannerSub').textContent = 'Incredible teamwork — you all crushed it! 🎉';
    buildConfetti(true);
  } else {
    const notReady = mergedKids.filter(k => (k.currentPoints != null ? k.currentPoints : config.startPoints) < config.jackpotThreshold).map(k => k.name);
    const earningCount = mergedKids.filter(k => (k.currentPoints != null ? k.currentPoints : config.startPoints) >= config.partialThreshold).length;
    if (earningCount > 0) {
      banner.className = 'jackpot-banner partial';
      document.getElementById('bannerEmoji').textContent = '💪';
      document.getElementById('bannerMain').textContent = notReady.join(' & ') + ' — keep going!';
      document.getElementById('bannerSub').textContent = earningCount + ' of ' + mergedKids.length + ' earning $' + config.partialReward + ' — all need ' + config.jackpotThreshold + '+ pts for $' + config.jackpotReward + '!';
    } else {
      banner.className = 'jackpot-banner none';
      document.getElementById('bannerEmoji').textContent = '😬';
      document.getElementById('bannerMain').textContent = "No rewards yet — let's get going!";
      document.getElementById('bannerSub').textContent = 'Need ' + config.partialThreshold + '+ pts for $' + config.partialReward + ', or ' + config.jackpotThreshold + '+ each for $' + config.jackpotReward + '!';
    }
    buildConfetti(false);
  }

  // Build table
  const card = document.createElement('div');
  card.className = 'table-card';

  // ── Header row (kid names + avatars) ────────────────
  const headerRow = document.createElement('div');
  headerRow.className = 'kid-headers';

  // spacer
  const spacer = document.createElement('div');
  spacer.className = 'row-label-head';
  headerRow.appendChild(spacer);

  mergedKids.forEach((kid, i) => {
    const col = document.createElement('div');
    col.className = 'kid-col';
    col.style.setProperty('--delay', (i * 0.1) + 's');
    col.innerHTML = `<div class="kid-avatar">${kid.emoji}</div><div class="kid-name">${kid.name}</div>`;
    headerRow.appendChild(col);
  });
  card.appendChild(headerRow);

  // ── Points row ───────────────────────────────────────
  const pointsRow = document.createElement('div');
  pointsRow.className = 'data-row points-row';

  const pointsLabel = document.createElement('div');
  pointsLabel.className = 'row-label';
  pointsLabel.innerHTML = '<span class="rl-icon">⭐</span><span class="rl-text">Points</span>';
  pointsRow.appendChild(pointsLabel);

  mergedKids.forEach((kid, i) => {
    const pts = kid.currentPoints != null ? kid.currentPoints : config.startPoints;
    const pct = Math.min(100, Math.round((pts / config.jackpotThreshold) * 100));
    const cell = document.createElement('div');
    cell.className = 'data-cell';
    cell.style.setProperty('--delay', (i * 0.1 + 0.2) + 's');
    cell.innerHTML = `
      <div class="pts-num">${pts}</div>
      <div class="pts-bar-wrap">
        <div class="pts-bar-track">
          <div class="pts-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>`;
    pointsRow.appendChild(cell);
  });
  card.appendChild(pointsRow);

  // ── Payout row ───────────────────────────────────────
  const payoutRow = document.createElement('div');
  payoutRow.className = 'data-row payout-row';

  const payoutLabel = document.createElement('div');
  payoutLabel.className = 'row-label';
  payoutLabel.innerHTML = '<span class="rl-icon">💰</span><span class="rl-text">Payout</span>';
  payoutRow.appendChild(payoutLabel);

  mergedKids.forEach((kid, i) => {
    const pts = kid.currentPoints != null ? kid.currentPoints : config.startPoints;
    const cell = document.createElement('div');
    cell.className = 'data-cell';
    cell.style.setProperty('--delay', (i * 0.1 + 0.3) + 's');

    // Payout logic mirrors parent app exactly:
    // allJackpot (every kid >= jackpotThreshold) → jackpotReward each
    // else >= partialThreshold → partialReward
    // else → $0
    let badgeCls, badgeText;
    if (allJackpot) {
      badgeCls = 'jackpot'; badgeText = '$' + config.jackpotReward + ' 🏆';
    } else if (pts >= config.partialThreshold) {
      badgeCls = 'partial'; badgeText = '$' + config.partialReward;
    } else {
      badgeCls = 'none'; badgeText = '$0';
    }

    cell.innerHTML = `<div class="payout-badge ${badgeCls}">${badgeText}</div>`;
    payoutRow.appendChild(cell);
  });
  card.appendChild(payoutRow);

  // ── Encouragement row ────────────────────────────────
  const encourageRow = document.createElement('div');
  encourageRow.className = 'data-row encourage-row';

  const encourageLabel = document.createElement('div');
  encourageLabel.className = 'row-label';
  encourageLabel.innerHTML = '<span class="rl-icon">💬</span><span class="rl-text">Tip</span>';
  encourageRow.appendChild(encourageLabel);

  mergedKids.forEach((kid, i) => {
    const cell = document.createElement('div');
    cell.className = 'data-cell';
    cell.style.setProperty('--delay', (i * 0.1 + 0.4) + 's');
    const enc = getEncouragement(kid, config, allJackpot, mergedKids);
    cell.innerHTML = `<span class="encourage-icon">${enc.icon}</span><div class="encourage-text">${enc.text}</div>`;
    encourageRow.appendChild(cell);
  });
  card.appendChild(encourageRow);

  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  main.appendChild(card);
}

// ── Init ──────────────────────────────────────────────
function init() {
  buildStars();
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    document.getElementById('weekLabel').textContent = 'Connecting…';

    db.ref('familyPoints').on('value', function(snap) {
      const data = snap.val();
      if (!data) {
        document.getElementById('mainContent').innerHTML = '<div class="loading"><span>📭</span><p>No data yet.<br>Open the parent app first.</p></div>';
        document.getElementById('weekLabel').textContent = 'No data yet';
        return;
      }
      if (!data.currentWeek) {
        document.getElementById('mainContent').innerHTML = '<div class="loading"><span>📭</span><p>No current week.<br>Tap New Week in the parent app.</p></div>';
        return;
      }
      render(data);
    }, function(err) {
      document.getElementById('mainContent').innerHTML = '<div class="loading"><span>😕</span><p>Error: ' + err.message + '</p></div>';
    });
  } catch(e) {
    document.getElementById('mainContent').innerHTML = '<div class="loading"><span>😕</span><p>Init error: ' + e.message + '</p></div>';
  }
}

init();
</script>

</body>
</html>
