<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Starfall Defence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #060a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 12px 8px 24px;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    color: #c0e0f0;
    overflow-x: hidden;
  }
  #orientation-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #060a0f;
    color: #c0e0f0;
    font-family: 'Share Tech Mono', monospace;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-size: 15px;
    text-align: center;
    z-index: 100;
    padding: 24px;
  }
  #orientation-overlay .rotate-icon {
    font-size: 52px;
    animation: spin 2s linear infinite;
  }
  @keyframes spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @media (orientation: portrait) {
    #orientation-overlay { display: flex; }
  }
  #test-banner {
    width: 100%;
    max-width: 1008px;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 4px;
    font-family: 'Share Tech Mono', monospace;
    display: none;
  }
  #test-banner.pass { background: #0a2a0a; color: #40ff80; display: block; border: 1px solid #1a4a1a; }
  #test-banner.fail { background: #2a0808; color: #ff6060; display: block; border: 1px solid #4a1010; }
  #game-canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
    image-rendering: pixelated;
    max-width: 100%;
  }
</style>
</head>
<body>
<div id="orientation-overlay">
  <div class="rotate-icon">↻</div>
  <div>Rotate your device to landscape to play</div>
</div>
<div id="test-banner"></div>
<canvas id="game-canvas"></canvas>

<!-- Load order matches dependency graph exactly. Bump ?v=N on every deployment. -->
<script>
  const V = '6';  // ← the only number you ever change
  const files = [
    'config','maploader','gamestate','enemymanager',
    'towermanager','projectilemanager','wavecontroller',
    'screenmanager','renderer','input','game','tests','main'
  ];
  files.forEach(f => {
    const s = document.createElement('script');
    s.src = `${f}.js?v=${V}`;
    s.async = false; // preserve load order
    document.head.appendChild(s);
  });
</script>
</body>
</html>
